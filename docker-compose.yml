name: mvp_realty_db

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mvp_realty_db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mvp_realty_db
      POSTGRES_PASSWORD: mvp_realty_db
      POSTGRES_DB: mvp_realty_db
    ports:
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mvp_realty_db -d mvp_realty_db']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:

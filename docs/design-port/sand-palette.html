<!doctype html>
<!--
  Source for sand-palette.png — the shareable board of the locked Sand palette.

  Hex values are duplicated from tooling/tailwind-config/theme.css, which stays the
  single source of truth. When a token changes there, update the `T` map below and
  re-export. RGB values and every WCAG contrast ratio are computed at render time,
  so only the hex codes need editing.

  Re-export: open this file in a browser sized to 1600x900 and screenshot, or drive
  it headlessly. The board is laid out to fill exactly 1600x900 CSS pixels; setting
  `document.documentElement.style.zoom = '2'` against a 3200x1800 viewport yields the
  2x PNG. Anything that overflows 900px is clipped, so check
  `document.querySelector('.board').scrollHeight` after editing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>55 Living Team — Sand color system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #faf6f0;
        --surface-muted: #f4ede4;
        --surface-soft: #fbf8f1;
        --primary: #11355c;
        --primary-deep: #0c2540;
        --accent: #3cb6b3;
        --accent-deep: #2a9c99;
        --accent-soft: #c2eeed;
        --cta: #5fd3d0;
        --ink: #1b2b3a;
        --ink-soft: #3a4d63;
        --muted: #6a7a8c;
        --line: #e6dccb;
        --hair: rgba(27, 43, 58, 0.15);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
      }

      body {
        background: var(--surface);
        color: var(--ink);
        font-family: Manrope, ui-sans-serif, system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .board {
        width: 1600px;
        height: 900px;
        padding: 36px 52px 32px;
        display: flex;
        flex-direction: column;
      }

      /* ---------- masthead ---------- */
      .masthead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 56px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-deep);
        margin-bottom: 6px;
      }
      h1 {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--primary);
      }
      .lede {
        font-size: 15px;
        color: var(--ink-soft);
        max-width: 560px;
        text-align: right;
      }
      .lede b {
        color: var(--ink);
        font-weight: 700;
      }
      .signature {
        display: flex;
        margin-top: 14px;
        border-radius: 4px;
        overflow: hidden;
      }
      .signature div {
        height: 9px;
      }

      /* ---------- family grid ---------- */
      .families {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        column-gap: 13px;
        row-gap: 18px;
        margin-top: 22px;
      }
      .fam-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 11.5px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--primary);
        white-space: nowrap;
      }
      .rule {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .fam-note {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .chips {
        display: grid;
        column-gap: 13px;
      }
      .swatch {
        background: var(--surface-soft);
        border: 1px solid var(--hair);
        border-radius: 10px;
        overflow: hidden;
      }
      .chip {
        height: 56px;
        border-bottom: 1px solid var(--hair);
      }
      .info {
        padding: 9px 11px 11px;
      }
      .name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .hex {
        font-size: 12.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
        color: var(--accent-deep);
        line-height: 1.35;
      }
      .role {
        font-size: 11px;
        line-height: 1.35;
        color: var(--muted);
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
        height: 34px;
      }

      /* ---------- bottom band ---------- */
      .bottom {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 46px;
        margin-top: 22px;
        flex: 1;
        min-height: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      th {
        text-align: left;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 3px 0;
        border-bottom: 1px solid var(--line);
        color: var(--ink-soft);
        line-height: 1.35;
      }
      td.pair {
        font-weight: 600;
        color: var(--ink);
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        color: var(--ink);
        padding-right: 12px;
        width: 78px;
      }
      td.grade {
        width: 178px;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: middle;
      }
      .pv {
        display: inline-block;
        width: 26px;
        text-align: center;
        padding: 1px 0;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 700;
        margin-right: 10px;
        border: 1px solid var(--hair);
        vertical-align: middle;
      }

      .specimen {
        background: var(--surface-muted);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 20px 22px 22px;
      }
      .specimen .s1 {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.022em;
        color: var(--ink);
        line-height: 1.15;
      }
      .specimen .s2 {
        font-size: 13.5px;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .specimen .s3 {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .btns {
        display: flex;
        gap: 9px;
        margin-top: 16px;
      }
      .btn {
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 10px;
        border: 1px solid transparent;
      }
      .btn-cta {
        background: var(--cta);
        color: var(--primary-deep);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        color: var(--primary);
        border-color: var(--line);
      }
      .caption {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 8px;
      }
      .caption b {
        color: var(--ink-soft);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="board" id="board"></div>

    <script>
      const T = {
        surface: ['#faf6f0', 'Page background. Warm paper, never white.'],
        'surface-soft': ['#fbf8f1', 'Cards lifted off the page.'],
        'surface-muted': ['#f4ede4', 'Recessed and alternating bands.'],
        'line-soft': ['#efe7d9', 'Faintest hairline, inside cards.'],
        line: ['#e6dccb', 'Default border. Sand-tinted, not grey.'],
        primary: ['#11355c', 'Navigation, headings, solid buttons.'],
        'primary-deep': ['#0c2540', 'Pressed states, darkest fill.'],
        'on-primary': ['#ffffff', 'Type sitting on brand fills.'],
        accent: ['#3cb6b3', 'Icons, rules, decorative highlights.'],
        'accent-deep': ['#2a9c99', 'The seafoam that can carry text.'],
        'accent-soft': ['#c2eeed', 'Tinted wash, text selection.'],
        cta: ['#5fd3d0', 'Primary call-to-action fill.'],
        'on-cta': ['#0c2540', 'Type on the call-to-action fill.'],
        ring: ['#2a9c99', 'Keyboard focus ring.'],
        ink: ['#1b2b3a', 'Body copy and headings.'],
        'ink-soft': ['#3a4d63', 'Secondary and long-form copy.'],
        muted: ['#6a7a8c', 'Captions, metadata, small labels.'],
      };

      const FAMILIES = [
        {
          title: 'Surfaces & hairlines',
          note: 'Warm sand, not white',
          span: 5,
          keys: ['surface', 'surface-soft', 'surface-muted', 'line-soft', 'line'],
        },
        {
          title: 'Brand — deep ocean ink',
          note: 'Anchors the page',
          span: 4,
          keys: ['primary', 'primary-deep', 'on-primary'],
        },
        {
          title: 'Accent & call to action — seafoam',
          note: 'ring = accent-deep · on-cta = primary-deep',
          span: 6,
          keys: ['accent', 'accent-deep', 'accent-soft', 'cta', 'on-cta', 'ring'],
        },
        {
          title: 'Ink — text hierarchy',
          note: 'Warm blue-grey',
          span: 3,
          keys: ['ink', 'ink-soft', 'muted'],
        },
      ];

      const PAIRS = [
        ['ink', 'surface'],
        ['primary', 'surface'],
        ['ink-soft', 'surface'],
        ['on-primary', 'primary'],
        ['on-cta', 'cta'],
        ['muted', 'surface'],
        ['muted', 'surface-muted'],
        ['accent-deep', 'surface'],
        ['accent', 'surface'],
      ];

      const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
      const lum = (h) =>
        rgb(h)
          .map((v) => v / 255)
          .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)))
          .reduce((a, c, i) => a + c * [0.2126, 0.7152, 0.0722][i], 0);
      const ratio = (a, b) => {
        const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
        return (x + 0.05) / (y + 0.05);
      };
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

      let html = '';

      html += `
        <div class="masthead">
          <div>
            <div class="eyebrow">Color system</div>
            <h1>Sand</h1>
          </div>
          <p class="lede">The approved palette for the 55 Living Team site. Warm sand surfaces,
            deep ocean ink for brand, seafoam for accent and call to action.
            <b>17 roles · Manrope · 10px radius · light mode only.</b></p>
        </div>
        <div class="signature">
          ${['primary', 'accent', 'cta', 'accent-soft', 'surface-muted', 'line']
            .map((k) => `<div style="background:${T[k][0]};flex:${k === 'primary' ? 3 : 1}"></div>`)
            .join('')}
        </div>`;

      html += '<div class="families">';
      for (const fam of FAMILIES) {
        html += `<div style="grid-column:span ${fam.span}">
            <div class="fam-head">
              <h2>${esc(fam.title)}</h2>
              <div class="rule"></div>
              <div class="fam-note">${esc(fam.note)}</div>
            </div>
            <div class="chips" style="grid-template-columns:repeat(${fam.keys.length},1fr)">`;
        for (const k of fam.keys) {
          const [hex, role] = T[k];
          html += `<div class="swatch">
              <div class="chip" style="background:${hex}"></div>
              <div class="info">
                <div class="name">${k}</div>
                <div class="hex">${hex.toUpperCase()}</div>
                <div class="role">${esc(role)}</div>
              </div>
            </div>`;
        }
        html += '</div></div>';
      }
      html += '</div>';

      let rows = '';
      for (const [f, b] of PAIRS) {
        const r = ratio(T[f][0], T[b][0]);
        const g =
          r >= 4.5
            ? ['#2a9c99', 'Any text size']
            : r >= 3
              ? ['#c08a2e', 'Large text & UI only']
              : ['#b4503f', 'Decorative only'];
        rows += `<tr>
            <td class="pair"><span class="dot" style="background:${g[0]}"></span>${f} on ${b}</td>
            <td class="num">${r.toFixed(2)}:1</td>
            <td class="grade"><span class="pv" style="background:${T[b][0]};color:${T[f][0]}">Aa</span>${g[1]}</td>
          </tr>`;
      }

      html += `
        <div class="bottom">
          <div>
            <div class="fam-head"><h2>Contrast</h2><div class="rule"></div>
              <div class="fam-note">WCAG 2.1</div></div>
            <table>
              <thead><tr>
                <th>Pair</th>
                <th style="text-align:right;padding-right:12px">Ratio</th>
                <th>Usable for</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <div class="caption"><b>Two colors to handle with care.</b> muted falls just under the
              4.5:1 minimum on sand, so it suits short labels rather than body copy. Neither seafoam
              reaches 4.5:1 on sand — put seafoam type on the cta fill instead of on the page.</div>
          </div>
          <div>
            <div class="fam-head"><h2>In context</h2><div class="rule"></div>
              <div class="fam-note">Manrope</div></div>
            <div class="specimen">
              <div class="s1">Coastal living, considered.</div>
              <div class="s2">Secondary copy uses ink-soft so long paragraphs read a little lighter
                than headings without losing contrast on the sand background.</div>
              <div class="s3">Captions and metadata use muted.</div>
              <div class="btns">
                <button class="btn btn-cta">Book a viewing</button>
                <button class="btn btn-primary">View listings</button>
                <button class="btn btn-ghost">Learn more</button>
              </div>
            </div>
            <div class="caption">Set on surface-muted, with the three button treatments the system
              defines. <b>Single source of truth:</b> tooling/tailwind-config/theme.css</div>
          </div>
        </div>`;

      document.getElementById('board').innerHTML = html;
    </script>
  </body>
</html>
